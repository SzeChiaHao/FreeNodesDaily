name: Android

# 只干两件事：单元测试过不过、能不能编出 APK。
# 不发布、不碰 version.json —— 发布还是走 build-apk.ps1 -Release 那一条。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Android SDK（compileSdk 34 / build-tools 34）
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: 缓存 Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 单元测试（Robolectric 冒烟 + 线格式）
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: 编译 release APK（不签名、不发布，只验证能出包）
        run: ./gradlew --no-daemon assembleRelease

      - name: 上传测试报告与 debug 包
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            android/app/build/reports/tests/**
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: ignore
